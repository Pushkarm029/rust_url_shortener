[package]
name = "rust_url_shortener"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_url_shortener"
path = "src/lib.rs"

[dependencies]
# HTTP Server
axum = "0.8.3"
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.6.2", features = ["trace", "cors"] }

# Database
sqlx = { version = "0.7.3", features = ["runtime-tokio-rustls", "sqlite", "macros", "time"] }

# Serialization/Deserialization
serde = { version = "1.0.196", features = ["derive"] }

# Error handling
thiserror = "1.0.56"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities
rand = "0.9.0"
dotenv = "0.15.0"

# Added async-trait dependency
async-trait = "0.1.77"

[features]
metrics = []
