[package]
name = "rust_url_shortener"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_url_shortener"
path = "src/lib.rs"

[dependencies]
# HTTP Server
axum = "0.8.3"
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.5.0", features = ["trace", "cors"] }
hyper = "1.1.0"

# Database
sqlx = { version = "0.7.3", features = ["runtime-tokio-rustls", "sqlite", "macros", "time"] }
diesel = { version = "2.1.4", features = ["sqlite"] }

# Serialization/Deserialization
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.114"

# Error handling
thiserror = "1.0.56"
anyhow = "1.0.79"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities
rand = "0.8.5"
chrono = { version = "0.4.34", features = ["serde"] }
dotenv = "0.15.0"
uuid = { version = "1.7.0", features = ["v4", "serde"] }

# Feature flags
cfg-if = "1.0.0"

# Added async-trait dependency
async-trait = "0.1.77"

[features]
metrics = []

[dev-dependencies]
# Use a compatible version that works with Axum 0.8.x
axum-test = "14.2.2"